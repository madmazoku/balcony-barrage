name: Check and publish accepted game

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag and accepted ancestry
        run: python tools/release.py validate-tag
      - uses: ./.github/actions/setup-godot
        with:
          native: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/setup-java@v6
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android tools
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$ANDROID_HOME/platform-tools/adb" start-server
      - name: Check and export candidate builds
        if: github.event_name == 'pull_request'
        run: python tools/release.py build --native
      - name: Check and export accepted preview
        if: github.ref == 'refs/heads/master'
        run: python tools/release.py build
      - name: Check and export signed tag builds
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python tools/release.py build --native
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-release.p12"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        with:
          name: game-builds
          path: builds/release/
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: game-builds
          path: builds/release
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py publish

  deploy:
    if: always() && github.event_name == 'push' && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: balcony-pages-site
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fetch master after obtaining the site lock; an old tag cannot roll back the root.
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: ./.github/actions/setup-godot
      - name: Check latest accepted root and assemble all released versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release.py check
          python tools/release.py web
          python tools/release.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: builds/site
      - name: Publish accepted game and version catalog
        id: deployment
        uses: actions/deploy-pages@v4
